<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Crystal Audit Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#262B27; --ink:#1B1E1B; --ink-soft:#4C554D;
    --paper:#F6F5F1; --paper-2:#ECF2ED; --line:#D3DBD4;
    --green:#1F5C8C; --green-deep:#123A57; --green-light:#E4ECF3;
    --serif:'Newsreader', Georgia, serif; --sans:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--sans); background:var(--paper); color:var(--ink); font-weight:500;}
  a{color:inherit;}

  /* ---- Login ---- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:#fff; border:3px solid var(--green); padding:44px 40px; max-width:380px; width:100%;
    box-shadow:0 4px 0 var(--green-deep);
  }
  .login-card h1{font-family:var(--serif); font-size:24px; font-weight:700; color:var(--charcoal); margin-bottom:8px;}
  .login-card p{font-size:14px; color:var(--ink-soft); margin-bottom:22px;}
  .login-card input{width:100%; padding:13px 14px; border:2px solid var(--line); border-radius:3px; font-size:15px; margin-bottom:14px; font-family:var(--sans);}
  .login-card button{width:100%; padding:13px; background:var(--green-deep); color:#fff; border:none; border-radius:3px; font-weight:700; font-size:15px; cursor:pointer;}
  .login-card button:hover{background:var(--green);}
  .login-error{color:#B4423A; font-size:13px; margin-top:-6px; margin-bottom:12px; display:none;}
  .login-hint{font-size:12px; color:#8B928B; margin-top:16px;}

  /* ---- Dashboard ---- */
  #dashboard{display:none;}
  .admin-header{
    background:var(--charcoal); color:#fff; padding:18px 28px;
    display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;
  }
  .admin-header h1{font-family:var(--serif); font-size:18px; font-weight:700;}
  .admin-header a.view-site{font-size:13px; color:#CFE9DA; font-weight:700; margin-right:18px;}
  .admin-header button{background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff; padding:8px 14px; border-radius:3px; cursor:pointer; font-weight:600; font-size:13px;}
  .admin-layout{display:flex; min-height:calc(100vh - 62px);}
  .admin-tabs{
    width:230px; flex:none; background:#fff; border-right:2px solid var(--line); padding:18px 0;
  }
  .admin-tabs button{
    display:block; width:100%; text-align:left; padding:12px 24px; background:none; border:none;
    font-size:14.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-left:3px solid transparent;
  }
  .admin-tabs button:hover{color:var(--charcoal); background:var(--paper-2);}
  .admin-tabs button.active{color:var(--green-deep); border-left-color:var(--green); background:var(--green-light);}
  .admin-content{flex:1; padding:32px 40px; max-width:860px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .panel h2{font-family:var(--serif); font-size:22px; font-weight:700; color:var(--charcoal); margin-bottom:6px;}
  .panel > p.desc{font-size:14px; color:var(--ink-soft); margin-bottom:28px;}
  .f-group{margin-bottom:18px;}
  .f-group label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .f-group input, .f-group textarea, .f-group select{
    width:100%; padding:11px 13px; border:2px solid var(--line); border-radius:3px; font-size:14.5px; font-family:var(--sans); color:var(--ink);
  }
  .f-group textarea{min-height:80px; resize:vertical;}
  .f-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .swatch-row{display:flex; align-items:center; gap:10px;}
  .swatch-row input[type=color]{width:44px; height:38px; padding:2px; border:2px solid var(--line); border-radius:3px; cursor:pointer;}

  .list-editor{border:2px solid var(--line); background:var(--paper-2); padding:16px; margin-bottom:10px;}
  .list-item{background:#fff; border:1px solid var(--line); padding:14px; margin-bottom:10px; position:relative;}
  .list-item .remove-btn{
    position:absolute; top:10px; right:10px; background:none; border:none; color:#B4423A; cursor:pointer; font-size:12px; font-weight:700;
  }
  .add-btn{background:var(--green-deep); color:#fff; border:none; padding:10px 16px; border-radius:3px; font-weight:700; font-size:13px; cursor:pointer;}
  .add-btn:hover{background:var(--green);}
  .save-btn{
    background:var(--green-deep); color:#fff; border:none; padding:13px 24px; border-radius:3px;
    font-weight:700; font-size:14.5px; cursor:pointer; margin-top:18px;
  }
  .save-btn:hover{background:var(--green);}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--green-deep); color:#fff; padding:14px 22px;
    border-radius:4px; font-weight:700; font-size:14px; box-shadow:0 6px 18px rgba(0,0,0,0.2);
    opacity:0; transform:translateY(10px); transition:all .25s ease; pointer-events:none; z-index:100;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .thumb-preview{width:100%; max-width:220px; height:120px; object-fit:cover; border:2px solid var(--line); margin-top:8px; background:var(--paper-2);}
  .backup-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;}
  .btn-outline{background:#fff; border:2px solid var(--green-deep); color:var(--green-deep); padding:11px 18px; border-radius:3px; font-weight:700; font-size:13.5px; cursor:pointer;}
  .btn-outline:hover{background:var(--green-light);}
  .danger{border-color:#B4423A; color:#B4423A;}
  .danger:hover{background:#FBEAE9;}

  @media (max-width:800px){
    .admin-layout{flex-direction:column;}
    .admin-tabs{width:100%; display:flex; overflow-x:auto; padding:8px;}
    .admin-tabs button{width:auto; white-space:nowrap; border-left:none; border-bottom:3px solid transparent;}
    .admin-tabs button.active{border-left:none; border-bottom-color:var(--green);}
    .admin-content{padding:24px 18px;}
    .f-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Administration</h1>
    <p>Connectez-vous pour modifier les textes, photos et coordonnées du site.</p>
    <input type="password" id="loginPass" placeholder="Mot de passe">
    <p class="login-error" id="loginError">Mot de passe incorrect.</p>
    <button onclick="cafAttemptLogin()">Se connecter</button>
    <p class="login-hint">Mot de passe par défaut : crystal2026 (à changer dans l'onglet Sécurité une fois connecté).</p>
  </div>
</div>

<div id="dashboard">
  <div class="admin-header">
    <h1>Crystal Audit Finance — Administration</h1>
    <div>
      <a class="view-site" href="index.html" target="_blank">Voir le site ↗</a>
      <button onclick="cafLogout()">Se déconnecter</button>
    </div>
  </div>
  <div class="admin-layout">
    <nav class="admin-tabs" id="adminTabs"></nav>
    <div class="admin-content" id="adminContent"></div>
  </div>
</div>

<div class="toast" id="toast">Modifications enregistrées</div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
